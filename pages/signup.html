<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FinTrack Pro</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body id="signupPage">
    <div>
        <h2>Create Account <br> FinTrack Pro</h2>
        <form id="signUpForm">
            <input id="signUpEmail" type="email" placeholder="Enter your Email..." required>
            <input id="signUpPassword" type="password" placeholder="Enter your Password" required>
            <button type="submit">Sign Up</button>
            <hr>
            <p>Already have an account? <a href="login.html">Login</a></p>
        </form>
    </div>

    <script src="../app.js"></script>

</body>

</html>
