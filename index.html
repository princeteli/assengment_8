<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header>
        <span id="userEmail">User</span> <a href="./pages/login.html" class="logout-btn">LogOut</a>
    </header>

    <div class="layout">
        <aside>
            <nav>
                <h2>FinTrack Pro</h2>
                <p>Enter prise Finance</p>
                <ul>
                    <li><a href="index.html" class="nav-btn">DashBoard</a></li>
                    <li><a href="./pages/settings.html" class="nav-btn"> Setting</a></li>
                </ul>
                <button id="addTransactionBtn">+ Add Transaction</button>
            </nav>


        </aside>
        <main>
            <h2>Financial Overview</h2>
            <div class="cards-grid">
                <div class="card">
                    <p>bank</p>
                    <span id="currentBalance">$0.00</span>
                </div>
                <div class="card">
                    <p>tt income</p>
                    <span id="totalIncome">$0.00</span>
                </div>
                <div class="card">
                    <p>tt exprense</p>
                    <span id="totalExpense">$0.00</span>
                </div>
                <div class="card">
                    <p>tt transactions</p>
                    <span id="totalTransactions">$0.00</span>
                </div>
            </div>

            <div class="dashboard-grid">

                <div class="chart-box">
                    <h2>Cash Flow Analysis</h2>
                    <canvas id="cashFlowChart"></canvas>
                </div>

                <div class="preferences-box">
                    <h2>Preferences</h2>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                        <span id="themeLabel"></span>
                        <label class="switch">
                            <input type="checkbox" id="darkModeToggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <button id="resetDataBtn">🗑 Reset All Data</button>
                </div>
            </div>

            <div class="transactions">
                <h2>All Transactions</h2>
                <div>
                    <input type="text" name="" id="searchTransaction" placeholder="search Transaction..">
                    <select name="" id="selectTransaction">
                        <option value="alltype">all   type</option>
                        <option value="income">income</option>
                        <option value="expense">expense</option>
                    </select>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>DATE</th>
                            <th>DESCRIPTION</th>
                            <th>CATEGORY</th>
                            <th>AMOUNT</th>
                            <th>ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody id="transactionsTableBody">
                        <!-- JS yaha rows daalega -->
                    </tbody>
                </table>
            </div>


        </main>
    </div>

    <div id="transactionModal" class="modal hidden">
        <div class="modal-content">
            <form id="transactionForm">
                <div class="modal-header">
                    <h2>Add Transaction</h2>
                    <span id="closeModalBtn" class="close-btn">&times;</span>
                </div>

                <label>Type</label>
                <select id="transactionType">
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>

                <label>Description</label>
                <input type="text" id="transactionDescription" placeholder="e.g. Amazon, Salary, Coffee">

                <div class="form-row">
                    <div>
                        <label>Amount</label>
                        <input type="number" id="transactionAmount" placeholder="0">
                    </div>
                    <div>
                        <label>Date</label>
                        <input type="date" id="transactionDate">
                    </div>
                </div>

                <label>Category</label>
                <select id="transactionCategory">
                    <option value="">Select a category</option>
                    <option value="Food & Dining">Food & Dining</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Recharge & Bills">Recharge & Bills</option>
                    <option value="Petrol & Auto">Petrol & Auto</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Salary">Salary</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>

                <button  type="submit">Save Transaction</button>
            </form>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./app.js"></script>
</body>

</html>
